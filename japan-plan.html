function getPhase(w){return PHASES.find(p=>p.weeks.includes(w));}
function getWeekDates(w){
  const s=new Date(JAPAN_START);s.setDate(s.getDate()+(w-1)*7);

  const f=d=>d.toLocaleDateString("es-MX",{day:"numeric",month:"short"});

}

  ]};
}

function getWorkout(day,week){
  if(day==="lunes")return getPushA(week);
  if(day==="martes")return getPull(week);
  if(day==="miercoles")return getLegsA(week);
  if(day==="jueves")return getPushB(week);
  if(day==="viernes")return getLegsB(week);
  if(day==="sabado")return getWalk(week);
  return null;
}

// ─── MINI CHART ───────────────────────────────────────────────────────────────
function MiniChart({data,color,label,unit=""}){
  if(!data||data.length<2)return(
    <div style={{height:60,display:"flex",alignItems:"center",justifyContent:"center",color:"#333",fontSize:11}}>
      Sin datos aún
    </div>
  );
  const vals=data.map(d=>d.val).filter(v=>v!=null);
  if(vals.length<2)return null;
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const W=280,H=60,PAD=8;
  const pts=data.filter(d=>d.val!=null);
  const xStep=(W-PAD*2)/(pts.length-1||1);
  const points=pts.map((d,i)=>{
    const x=PAD+i*xStep;
    const y=H-PAD-((d.val-min)/range)*(H-PAD*2);
    return`${x},${y}`;
  }).join(" ");
  const last=pts[pts.length-1];
  const first=pts[0];
  const delta=last&&first?(last.val-first.val).toFixed(1):null;
  const deltaColor=delta>0?(color===GREEN||color===TEAL?"#FC5C65":GREEN):GREEN;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{fontSize:10,color:"#666"}}>{label}</span>
        {delta!==null&&<span style={{fontSize:10,fontWeight:700,color:deltaColor}}>{delta>0?"+":""}{delta}{unit}</span>}
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
        <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map((d,i)=>{
          const x=PAD+i*xStep;
          const y=H-PAD-((d.val-min)/range)*(H-PAD*2);
          return<circle key={i} cx={x} cy={y} r="2.5" fill={color}/>;
        })}
        {last&&(()=>{
          const x=PAD+(pts.length-1)*xStep;
          const y=H-PAD-((last.val-min)/range)*(H-PAD*2);
          return<text x={x} y={y-6} textAnchor="middle" fontSize="9" fill={color} fontWeight="700">{last.val}{unit}</text>;
        })()}
      </svg>
    </div>
  );
}

// ─── COMPOSITION CHART ────────────────────────────────────────────────────────
function CompositionChart({weightData,visible,onToggle}){
  const weeks=Array.from({length:26},(_,i)=>i+1);
  const weekAvgs=weeks.map(w=>{
    const start=new Date(JAPAN_START);start.setDate(start.getDate()+(w-1)*7);
    const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d.toISOString().split("T")[0];});
    const entries=days.map(d=>weightData[d]).filter(e=>e&&e.kg);
    if(!entries.length)return{w,kg:null,gras:null,musc:null};
    const avg=f=>{const v=entries.filter(e=>e[f]);return v.length?(v.reduce((s,e)=>s+(parseFloat(e[f])||0),0)/v.length):null;};
    return{w,kg:avg("kg")?parseFloat(avg("kg").toFixed(1)):null,gras:avg("gras")?parseFloat(avg("gras").toFixed(1)):null,musc:avg("musc")?parseFloat(avg("musc").toFixed(1)):null};
  }).filter(d=>d.kg||d.gras||d.musc);

  if(!weekAvgs.length)return(
    <div style={{padding:20,textAlign:"center",color:"#333",fontSize:12}}>
      Registra peso diario en el Tracker para ver las gráficas.
    </div>
  );

  const series=[
    {key:"kg",label:"Peso",color:ACCENT,unit:" kg",vis:visible.kg},
    {key:"gras",label:"% Grasa",color:RED,unit:"%",vis:visible.gras},
    {key:"musc",label:"% Músculo",color:GREEN,unit:"%",vis:visible.musc},
  ];

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {series.map(s=>(
          <button key={s.key} onClick={()=>onToggle(s.key)} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",background:s.vis?`${s.color}20`:"rgba(255,255,255,0.04)",border:`1px solid ${s.vis?s.color:"rgba(255,255,255,0.08)"}`,borderRadius:20,cursor:"pointer",color:s.vis?s.color:"#444",fontSize:11,fontWeight:s.vis?700:400}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:s.vis?s.color:"#333"}}/>
            {s.label}
          </button>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {series.filter(s=>s.vis).map(s=>(
          <MiniChart key={s.key} data={weekAvgs.map(d=>({w:d.w,val:d[s.key]}))} color={s.color} label={`${s.label} — promedio semanal`} unit={s.unit}/>
        ))}
      </div>
    </div>
  );
}

// ─── GYM CHART ────────────────────────────────────────────────────────────────
function GymChart({gymData}){
  // Build list of all exercises from all weeks
  const allExercises=new Set();
  Object.keys(gymData).forEach(key=>{
    const m=key.match(/^w(\d+)_(\w+)$/);
    if(!m)return;
    const w=parseInt(m[1]),day=m[2];
    const workout=getWorkout(day,w);
    if(!workout)return;
    workout.ejs.forEach((ej,i)=>{
      const maxKg=Object.keys(gymData[key]).filter(k=>k.startsWith(`kg_${i}`)).map(k=>parseFloat(gymData[key][k])||0).filter(v=>v>0);
      if(maxKg.length)allExercises.add(ej.n);
    });
  });

  const [selEx,setSelEx]=useState(null);
  const exList=Array.from(allExercises).sort();
  
  useEffect(()=>{if(exList.length&&!selEx)setSelEx(exList[0]);},[exList.join(",")]);

  const chartData=useMemo(()=>{
    if(!selEx)return[];
    const points=[];
    for(let w=1;w<=26;w++){
      DAYS.forEach(day=>{
        const key=`w${w}_${day}`;
        if(!gymData[key])return;
        const workout=getWorkout(day,w);
        if(!workout)return;
        const idx=workout.ejs.findIndex(e=>e.n===selEx);
        if(idx<0)return;
        const kgs=Object.keys(gymData[key]).filter(k=>k.startsWith(`kg_${idx}_`)).map(k=>parseFloat(gymData[key][k])||0).filter(v=>v>0);
        if(!kgs.length)return;
        const maxKg=Math.max(...kgs);
        points.push({w,day,val:maxKg,label:`S${w}`});
      });
    }
    return points;
  },[selEx,gymData]);

  if(!exList.length)return(
    <div style={{padding:20,textAlign:"center",color:"#333",fontSize:12}}>
      Registra cargas en el Tracker para ver la progresión.
    </div>
  );

  return(
    <div>
      <select value={selEx||""} onChange={e=>setSelEx(e.target.value)} style={{width:"100%",marginBottom:14,padding:"9px 12px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,color:"#fff",fontSize:12,outline:"none"}}>
        {exList.map(e=><option key={e} value={e} style={{background:"#1a1a2e"}}>{e}</option>)}
      </select>
      {chartData.length>=2?(
        <MiniChart data={chartData} color={ACCENT} label={`${selEx} — kg máximo por sesión`} unit=" kg"/>
      ):(
        <div style={{padding:20,textAlign:"center",color:"#333",fontSize:11}}>
          Necesitas al menos 2 sesiones registradas para ver la gráfica.
        </div>
      )}
    </div>
  );
}

    txt+="═══════════════════════════════════\n\n";

    txt+="📊 COMPOSICIÓN CORPORAL (PROMEDIOS SEMANALES)\n───────────────────────────────────\n";
    for(let w=1;w<=26;w++){
      const start=new Date(JAPAN_START);start.setDate(start.getDate()+(w-1)*7);

      <div style={{fontSize:10,fontWeight:700,color:"#444",letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>🎯 Protocolo del proyecto</div>
      <div style={{background:`${RED}08`,border:`1px solid ${RED}20`,borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:11,color:RED,fontWeight:700,lineHeight:1.6}}>
        Regla general: No cambiar el plan sin evidencia clara de que algo no está funcionando.
      </div>
      {items.map((item,i)=>(
        <div key={i} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
          <div style={{fontSize:18,flexShrink:0,marginTop:1}}>{item.icon}</div>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:"#ddd",marginBottom:2}}>{item.t}</div>
            <div style={{fontSize:11,color:"#555",lineHeight:1.5}}>{item.d}</div>
          </div>
        </div>
      ))}
      <div style={{marginTop:16,padding:"12px 14px",background:`${ACCENT}10`,border:`1px solid ${ACCENT}25`,borderRadius:12}}>
        <div style={{fontSize:10,fontWeight:700,color:ACCENT,letterSpacing:1,marginBottom:8}}>🧘 CALENTAMIENTO DIARIO (antes de cada sesión)</div>
        {WARMUP.map((w,i)=>(
          <div key={i} style={{fontSize:11,color:"#aaa",padding:"4px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>{i+1}. {w}</div>
        ))}
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
export default function App(){
  const [tab,setTab]=useState("plan");
  const [week,setWeek]=useState(1);
  const [day,setDay]=useState("lunes");
  const [gymData,setGymData]=useState({});
  const [weightData,setWeightData]=useState({});
  const [showWarmup,setShowWarmup]=useState(false);
  const [chartVis,setChartVis]=useState({kg:true,gras:true,musc:true});
  const [chartSub,setChartSub]=useState("comp");

  useEffect(()=>{const s=load();setGymData(s.gym||{});setWeightData(s.weight||{});},[]);
  const updGym=(k,v)=>{const u={...gymData,[k]:v};setGymData(u);save({gym:u,weight:weightData});};
  const updWeight=(k,v)=>{const u={...weightData,[k]:v};setWeightData(u);save({gym:gymData,weight:u});};

  const phase=getPhase(week);
  const workout=getWorkout(day,week);
  const dayColor=DAY_COLORS[day];

  const tabs=[["plan","📅 Plan"],["tracker","📊 Tracker"],["graficas","📈 Gráficas"],["exportar","📋 Exportar"],["protocolo","🎯 Protocolo"]];

  return(
    <div style={{minHeight:"100vh",background:"#080810",color:"#fff",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",paddingBottom:40}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(160deg,#0a0a18 0%,#080810 100%)",borderBottom:"1px solid rgba(255,255,255,0.06)",padding:"20px 20px 0"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:16}}>
          <div>
            <div style={{fontSize:10,letterSpacing:3,color:"#333",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Plan 26 Semanas</div>
            <div style={{fontSize:22,fontWeight:800,letterSpacing:-0.5}}>Japón 🇯🇵</div>
            <div style={{fontSize:12,color:"#444",marginTop:2}}>31 ago 2026 → 2 mar 2027 · PPL + Caminatas</div>
          </div>
          <div style={{background:`${ACCENT}15`,border:`1px solid ${ACCENT}35`,borderRadius:12,padding:"8px 12px",textAlign:"center"}}>
            <div style={{fontSize:10,color:ACCENT,fontWeight:700}}>VUELO</div>
            <div style={{fontSize:13,fontWeight:800,color:ACCENT}}>2 Mar</div>
            <div style={{fontSize:10,color:ACCENT}}>✈️ 2027</div>
          </div>
        </div>
        <div style={{display:"flex",overflowX:"auto",scrollbarWidth:"none"}}>
          {tabs.map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)} style={{flexShrink:0,padding:"10px 12px",border:"none",background:"transparent",color:tab===id?"#fff":"#444",fontSize:11,fontWeight:tab===id?700:400,borderBottom:tab===id?`2px solid ${ACCENT}`:"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"16px 16px 0"}}>

        {/* WEEK + DAY — shown in plan and tracker */}
        {(tab==="plan"||tab==="tracker")&&(
          <>
            {/* Phase strip */}
            <div style={{display:"flex",gap:3,marginBottom:12,overflowX:"auto",scrollbarWidth:"none",paddingBottom:2}}>
              {PHASES.map(p=>(
                <div key={p.id} style={{flexShrink:0,background:`${p.color}15`,border:`1px solid ${p.color}30`,borderRadius:7,padding:"4px 8px",minWidth:p.weeks.length*28}}>
                  <div style={{fontSize:8,fontWeight:800,color:p.color,whiteSpace:"nowrap"}}>{p.name}</div>
                  <div style={{fontSize:8,color:"#444"}}>S{p.weeks[0]}{p.weeks.length>1?`–${p.weeks[p.weeks.length-1]}`:""}</div>
                </div>
              ))}
            </div>

            {/* Week pills */}
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
              {Array.from({length:26},(_,i)=>i+1).map(w=>{
                const ph=getPhase(w);const isSel=w===week;
                return<button key={w} onClick={()=>setWeek(w)} style={{width:34,height:34,borderRadius:9,border:"none",background:isSel?ph.color:"rgba(255,255,255,0.05)",color:isSel?"#000":"#555",fontWeight:isSel?800:400,fontSize:12,cursor:"pointer",boxShadow:isSel?`0 0 10px ${ph.color}55`:"none"}}>{w}</button>;
              })}
            </div>

            {/* Phase info */}
            <div style={{padding:"8px 12px",background:`${phase.color}12`,border:`1px solid ${phase.color}25`,borderRadius:10,marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:700,color:phase.color}}>Fase {phase.id}: {phase.name} · {getWeekDates(week)}</div>
              <div style={{display:"flex",gap:6,marginTop:5}}>
                {[["RPE",phase.rpe],["Series",phase.sets],["Reps",phase.reps]].map(([l,v])=>(
                  <div key={l} style={{background:`${phase.color}18`,borderRadius:6,padding:"3px 8px"}}>
                    <span style={{fontSize:8,color:"#555"}}>{l}: </span>
                    <span style={{fontSize:10,fontWeight:700,color:phase.color}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Day selector */}
            <div style={{display:"flex",gap:5,marginBottom:14}}>
              {DAYS.map(dk=>{
                const isSel=dk===day;const accent=DAY_COLORS[dk];
                const hasData=tab==="tracker"&&Object.keys(gymData[`w${week}_${dk}`]||{}).length>0;
                return(
                  <button key={dk} onClick={()=>setDay(dk)} style={{flex:1,padding:"8px 2px",borderRadius:9,border:"none",background:isSel?`${accent}20`:"rgba(255,255,255,0.04)",color:isSel?accent:"#444",fontSize:10,fontWeight:isSel?700:400,cursor:"pointer",borderBottom:isSel?`2px solid ${accent}`:"2px solid transparent",position:"relative"}}>
                    {DAY_ICONS[dk]}<br/>{DAY_LABELS[dk]}
                    {hasData&&<span style={{position:"absolute",top:3,right:4,width:5,height:5,borderRadius:"50%",background:accent}}/>}
                  </button>
                );
              })}
            </div>
          </>
        )}

        {/* PLAN TAB */}
        {tab==="plan"&&(
          <div>
            {/* Warmup */}
            <button onClick={()=>setShowWarmup(!showWarmup)} style={{width:"100%",marginBottom:12,padding:"9px 14px",background:`${ACCENT}10`,border:`1px solid ${ACCENT}25`,borderRadius:10,color:ACCENT,fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",fontWeight:600}}>
              <span>🧘 Calentamiento diario (antes de empezar)</span>
              <span style={{fontSize:10}}>{showWarmup?"▲":"▼"}</span>
            </button>
            {showWarmup&&(
              <div style={{marginBottom:12,background:"rgba(255,255,255,0.02)",border:`1px solid ${ACCENT}20`,borderRadius:10,padding:12}}>
                {WARMUP.map((w,i)=>(
                  <div key={i} style={{fontSize:11,color:"#aaa",padding:"5px 0",borderBottom:i<WARMUP.length-1?"1px solid rgba(255,255,255,0.04)":"none"}}>
                    <span style={{color:ACCENT,fontWeight:700,marginRight:6}}>{i+1}.</span>{w}
                  </div>
                ))}
              </div>
            )}

            {workout&&(
              <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,overflow:"hidden"}}>
                <div style={{padding:"14px 16px",background:`${dayColor}12`,borderBottom:`2px solid ${dayColor}25`}}>
                  <div style={{fontSize:15,fontWeight:800}}>{workout.titulo}</div>
                  <div style={{fontSize:11,color:"#555",marginTop:2}}>{workout.sub}</div>
                </div>
                {workout.ejs.map((ej,i)=>(
                  <div key={i} style={{padding:"11px 16px",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                      <div style={{width:22,height:22,borderRadius:6,background:`${dayColor}18`,color:dayColor,fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:700,color:"#ddd",marginBottom:4}}>{ej.n}</div>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          {ej.s!=="—"&&<span style={{fontSize:9,background:`${dayColor}18`,color:dayColor,borderRadius:4,padding:"2px 7px",fontWeight:700}}>{ej.s} series</span>}
                          <span style={{fontSize:9,background:"rgba(255,255,255,0.06)",color:"#aaa",borderRadius:4,padding:"2px 7px"}}>{ej.r} reps</span>
                          {ej.rpe!=="—"&&ej.rpe!=="zona 2"&&<span style={{fontSize:9,background:"rgba(252,92,101,0.12)",color:RED,borderRadius:4,padding:"2px 7px"}}>RPE {ej.rpe}</span>}
                          {ej.rpe==="zona 2"&&<span style={{fontSize:9,background:`${GREEN}15`,color:GREEN,borderRadius:4,padding:"2px 7px"}}>Zona 2</span>}
                          <span style={{fontSize:9,background:"rgba(255,255,255,0.04)",color:"#555",borderRadius:4,padding:"2px 7px"}}>⏱ {ej.d}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
                <div style={{padding:"10px 14px",background:"rgba(252,92,101,0.05)",fontSize:10,color:RED,lineHeight:1.6}}>
                  ⚠️ Core activado · Columna neutral · Sin redondear lumbar · Dolor irradiado = stop
                </div>
              </div>
            )}
          </div>
        )}

        {/* TRACKER TAB */}
        {tab==="tracker"&&(
          <div>
            <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:16,marginBottom:14}}>
              <TrackerDay week={week} day={day} gymData={gymData} weightData={weightData} onGymChange={updGym} onWeightChange={updWeight}/>
            </div>
            <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:16}}>
              <WeightEntry week={week} data={weightData} onChange={updWeight}/>
            </div>
          </div>
        )}

        {/* GRAFICAS TAB */}
        {tab==="graficas"&&(
          <div>
            <div style={{display:"flex",gap:6,marginBottom:14}}>
              {[["comp","⚖️ Composición"],["gym","💪 Gym"],["cardio","🚶 Cardio"]].map(([k,l])=>(
                <button key={k} onClick={()=>setChartSub(k)} style={{flex:1,padding:"8px 4px",background:chartSub===k?`${ACCENT}18`:"rgba(255,255,255,0.04)",border:`1px solid ${chartSub===k?ACCENT:"rgba(255,255,255,0.07)"}`,borderRadius:10,color:chartSub===k?ACCENT:"#444",fontSize:10,fontWeight:chartSub===k?700:400,cursor:"pointer"}}>
                  {l}
                </button>
              ))}
            </div>
            <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:16}}>
              {chartSub==="comp"&&<CompositionChart weightData={weightData} visible={chartVis} onToggle={k=>setChartVis(v=>({...v,[k]:!v[k]}))}/>}
              {chartSub==="gym"&&<GymChart gymData={gymData}/>}
              {chartSub==="cardio"&&<CardioChart gymData={gymData}/>}
            </div>
          </div>
        )}

        {tab==="exportar"&&<ExportPanel gymData={gymData} weightData={weightData}/>}
        {tab==="protocolo"&&<Protocol/>}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
