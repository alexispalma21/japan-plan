  if(day==="viernes")return getLegsB(week);
  if(day==="sabado")return getWalk(week);
  return null;
}

// ── MINI CHART (SVG) ─────────────────────────────────────────────
function MiniChart({data,color,label,unit}){
  const pts=data.filter(d=>d.val!=null);
  if(pts.length<2)return h("div",{style:{padding:"12px",textAlign:"center",color:"#333",fontSize:11}},"Sin suficientes datos aún");
  const vals=pts.map(d=>d.val);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const W=300,H=70,P=10;
  const xStep=(W-P*2)/(pts.length-1);
  const points=pts.map((d,i)=>(P+i*xStep)+","+(H-P-((d.val-mn)/range)*(H-P*2))).join(" ");
  const last=pts[pts.length-1],first=pts[0];
  const delta=last&&first?(last.val-first.val).toFixed(1):null;
  const dColor=parseFloat(delta)>0?(color===C.green||color===C.teal?C.red:C.green):C.green;
  return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
      h("span",{style:{fontSize:10,color:"#555"}},label),
      delta!=null&&h("span",{style:{fontSize:10,fontWeight:700,color:dColor}},(parseFloat(delta)>0?"+":"")+delta+(unit||""))
    ),
    h("svg",{width:"100%",viewBox:"0 0 "+W+" "+H,style:{overflow:"visible"}},
      h("polyline",{points,fill:"none",stroke:color,strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"}),
      pts.map((d,i)=>h("circle",{key:i,cx:P+i*xStep,cy:H-P-((d.val-mn)/range)*(H-P*2),r:"3",fill:color})),
      h("text",{x:P+(pts.length-1)*xStep,y:H-P-((last.val-mn)/range)*(H-P*2)-8,textAnchor:"middle",fontSize:"9",fill:color,fontWeight:"700"},last.val+(unit||""))
    )
  );
}

      // GRAFICAS
      tab==="graficas"&&h("div",null,
        h("div",{style:{display:"flex",gap:5,marginBottom:12}},
          [["comp","⚖️ Composición"],["gym","💪 Gym"],["cardio","🚶 Cardio"]].map(([k,l])=>
            h("button",{key:k,onClick:()=>setChartSub(k),style:{flex:1,padding:"7px 3px",background:chartSub===k?C.gold+"18":"rgba(255,255,255,0.04)",border:"1px solid "+(chartSub===k?C.gold:"rgba(255,255,255,0.07)"),borderRadius:9,color:chartSub===k?C.gold:"#444",fontSize:10,fontWeight:chartSub===k?700:400,cursor:"pointer"}},l)
          )
        ),
        h("div",{style:{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:14}},
          chartSub==="comp"&&h("div",null,
            h("div",{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
              [{k:"kg",l:"Peso",c:C.gold,u:" kg"},{k:"gras",l:"% Grasa",c:C.red,u:"%"},{k:"musc",l:"% Músculo",c:C.green,u:"%"}].map(({k,l,c,u})=>
                h("button",{key:k,onClick:()=>setChartVis(v=>({...v,[k]:!v[k]})),style:{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",background:chartVis[k]?c+"20":"rgba(255,255,255,0.04)",border:"1px solid "+(chartVis[k]?c:"rgba(255,255,255,0.08)"),borderRadius:20,cursor:"pointer",color:chartVis[k]?c:"#444",fontSize:11,fontWeight:chartVis[k]?700:400}},
                  h("div",{style:{width:8,height:8,borderRadius:"50%",background:chartVis[k]?c:"#333"}}),l
                )
              )
            ),
            [{k:"kg",c:C.gold,l:"Peso — promedio semanal",u:" kg"},{k:"gras",c:C.red,l:"% Grasa — promedio semanal",u:"%"},{k:"musc",c:C.green,l:"% Músculo — promedio semanal",u:"%"}].filter(x=>chartVis[x.k]).map(({k,c,l,u})=>
              h("div",{key:k,style:{marginBottom:12}},
                h(MiniChart,{data:weekAvgs.map(d=>({w:d.w,val:d[k]})),color:c,label:l,unit:u})
              )
            ),
            !weekAvgs.length&&h("div",{style:{padding:20,textAlign:"center",color:"#333",fontSize:12}},"Registra peso diario en el Tracker para ver las gráficas.")
          ),
          chartSub==="gym"&&h("div",null,
            allExercises.length?h("div",null,
              h("select",{value:selEx,onChange:e=>setSelEx(e.target.value),style:{width:"100%",marginBottom:12,padding:"8px 11px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#fff",fontSize:12,outline:"none"}},
                allExercises.map(e=>h("option",{key:e,value:e},e))
              ),
              gymChartData.length>=2?h(MiniChart,{data:gymChartData,color:C.gold,label:selEx+" — kg máximo por sesión",unit:" kg"}):h("div",{style:{padding:16,textAlign:"center",color:"#333",fontSize:11}},"Necesitas al menos 2 sesiones registradas.")
            ):h("div",{style:{padding:20,textAlign:"center",color:"#333",fontSize:12}},"Registra cargas en el Tracker para ver la progresión.")
          ),
          chartSub==="cardio"&&h("div",null,
            h("div",{style:{display:"flex",gap:5,marginBottom:12}},
              [["dur","⏱ Duración (min)"],["fc","❤️ FC prom (ppm)"]].map(([k,l])=>
                h("button",{key:k,onClick:()=>setCardioMetric(k),style:{flex:1,padding:"6px",background:cardioMetric===k?C.green+"20":"rgba(255,255,255,0.04)",border:"1px solid "+(cardioMetric===k?C.green:"rgba(255,255,255,0.08)"),borderRadius:8,color:cardioMetric===k?C.green:"#444",fontSize:10,cursor:"pointer",fontWeight:cardioMetric===k?700:400}},l)
              )
            ),
            cardioData.length>=2?h(MiniChart,{data:cardioData,color:C.green,label:cardioMetric==="dur"?"Duración caminata":"FC promedio caminata",unit:cardioMetric==="dur"?" min":" ppm"}):h("div",{style:{padding:16,textAlign:"center",color:"#333",fontSize:11}},"Registra tus caminatas del sábado para ver la progresión.")
          )
        )
      ),

      // EXPORTAR
      tab==="exportar"&&h("div",null,
        h("div",{style:{fontSize:10,fontWeight:700,color:"#444",letterSpacing:2,textTransform:"uppercase",marginBottom:12}},"📋 Exportar para análisis"),
        h("div",{style:{background:C.teal+"10",border:"1px solid "+C.teal+"25",borderRadius:12,padding:13,marginBottom:14}},
          h("div",{style:{fontSize:12,fontWeight:700,color:C.teal,marginBottom:8}},"¿Cómo funciona?"),
          ["1. Registra tus cargas (kg) y RPE por serie en el Tracker.","2. Registra tu peso diario en ayunas.","3. Cada 1-2 semanas pulsa el botón de abajo.","4. Pega el texto en el chat para recibir recomendaciones."].map((s,i)=>
            h("div",{key:i,style:{fontSize:11,color:"#aaa",marginBottom:4,lineHeight:1.5}},s)
          )
        ),
        hasData?h("button",{onClick:()=>{navigator.clipboard.writeText(buildReport()).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),3000)});},style:{width:"100%",padding:"13px",background:copied?C.teal+"25":C.teal+"12",border:"2px solid "+(copied?C.teal:C.teal+"40"),borderRadius:12,color:C.teal,fontSize:14,fontWeight:800,cursor:"pointer"}},copied?"✅ ¡Copiado! Pégalo en el chat":"📋 Copiar reporte para Claude"):
        h("div",{style:{padding:18,textAlign:"center",background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12,color:"#333",fontSize:12}},"Aún no hay datos. Ve al Tracker y empieza a registrar.")
      ),

      // PROTOCOLO
      tab==="protocolo"&&h("div",null,
        h("div",{style:{fontSize:10,fontWeight:700,color:"#444",letterSpacing:2,textTransform:"uppercase",marginBottom:12}},"🎯 Protocolo del proyecto"),
        h("div",{style:{background:C.red+"08",border:"1px solid "+C.red+"20",borderRadius:10,padding:"9px 13px",marginBottom:13,fontSize:11,color:C.red,fontWeight:700,lineHeight:1.6}},
          "Regla general: No cambiar el plan sin evidencia clara de que algo no está funcionando."
        ),
        [
          {icon:"⚖️",t:"Registro diario",d:"Peso, % grasa y % músculo en ayunas, post-baño, misma hora todos los días."},
          {icon:"🍽️",t:"Plan alimenticio",d:"Seguir equivalentes de Regina. Mínimo 85% adherencia semanal."},
          {icon:"💪",t:"Entrenamiento",d:"5-6 días/semana. Sobrecarga progresiva. RPE controlado según la fase."},
          {icon:"🚶",t:"Caminatas progresivas",d:"Sábados. De 45 min a 4 horas con mochila. Específico para Japón."},
          {icon:"🧘",t:"Calentamiento diario",d:"4 ejercicios de movilidad de cadera antes de CADA sesión. Las 26 semanas."},
          {icon:"💊",t:"Suplementación",d:"Creatina 7g diaria. Omega 3. Magnesio glicinato 300-400mg pre-sueño."},
          {icon:"😴",t:"Descanso",d:"Mínimo 7-8 horas de sueño. Ajustar si hay fatiga acumulada."},
          {icon:"💧",t:"Hidratación",d:"2-3 litros diarios. Más en días de entreno intenso."},
          {icon:"🧠",t:"Enfoque mental",d:"Consistencia sobre perfección. No cambiar el plan sin evidencia clara."},
          {icon:"🚫",t:"Prohibidos permanentes",d:"Cualquier variante de peso muerto. Desplantes en cualquier variante."},
        ].map((item,i)=>h("div",{key:i,style:{display:"flex",gap:11,padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}},
          h("div",{style:{fontSize:17,flexShrink:0,marginTop:1}},item.icon),
          h("div",null,
            h("div",{style:{fontSize:12,fontWeight:700,color:"#ddd",marginBottom:2}},item.t),
            h("div",{style:{fontSize:11,color:"#555",lineHeight:1.5}},item.d)
          )
        )),
        h("div",{style:{marginTop:14,padding:"11px 13px",background:C.gold+"10",border:"1px solid "+C.gold+"25",borderRadius:11}},
          h("div",{style:{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:1,marginBottom:8}},"🧘 CALENTAMIENTO DIARIO"),
          WARMUP.map((w,i)=>h("div",{key:i,style:{fontSize:11,color:"#aaa",padding:"4px 0",borderBottom:i<WARMUP.length-1?"1px solid rgba(255,255,255,0.04)":"none"}},i+1+". "+w))
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
